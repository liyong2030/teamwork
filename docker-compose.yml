version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ctms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctms}
      POSTGRES_USER: ${POSTGRES_USER:-ctms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctms} -d ${POSTGRES_DB:-ctms}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ctms]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ctms-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ctms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ctms}
      SECRET_KEY: ${SECRET_KEY:?请设置 SECRET_KEY（可用 openssl rand -base64 48 生成）}
      TZ: Asia/Shanghai
      SCHEDULER_ENABLED: "true"
      RUN_MIGRATIONS: "true"
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - ./server/logs:/app/logs
      # 挂载根目录 .env：配置中心会直接读取它，新增配置项无需再改本文件。
      # 上面显式声明的环境变量优先级更高（环境变量 > .env）。
      - ./.env:/app/.env:ro
    networks: [ctms]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ctms-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [ctms]

volumes:
  pgdata:

networks:
  ctms:
    driver: bridge
